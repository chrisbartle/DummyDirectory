name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build Windows (.exe / .zip) and Linux (.deb / .rpm / .tar.gz)
  # ------------------------------------------------------------------
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: win64
          - os: ubuntu-latest
            artifact_name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The tests are driven by Python, and CMake only registers them if it can
      # find an interpreter
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Install rpm tooling on Ubuntu runner to enable CPack RPM generation
      - name: Install RPM Build Tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # -C Release is needed by multi-config generators and ignored by the rest.
      # --no-tests=error turns "nothing was registered" into a failure rather than
      # a silent pass, which is what ctest does by default.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Package with CPack
        run: cpack --config build/CPackConfig.cmake

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            *.exe
            *.zip
            *.deb
            *.rpm
            *.tar.gz
            build/*.exe
            build/*.zip
            build/*.deb
            build/*.rpm
            build/*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Job 2: Build FreeBSD (.tar.gz) inside QEMU VM
  # ------------------------------------------------------------------
  build-freebsd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake ninja gcc python3
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
            cmake --build build
            ctest --test-dir build --output-on-failure --no-tests=error
            cpack --config build/CPackConfig.cmake

      - name: Upload FreeBSD Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-freebsd
          path: |
            *.tar.gz
            build/*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Job 3: Create GitHub Release and Attach Packages
  # ------------------------------------------------------------------
  publish-release:
    needs: [build-native, build-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
