name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build Windows (.exe / .zip) and Linux (.deb / .tar.gz)
  # ------------------------------------------------------------------
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: win64
          - os: ubuntu-latest
            artifact_name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package with CPack
        run: cpack --config build/CPackConfig.cmake

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            *.exe
            *.zip
            *.deb
            *.tar.gz
            build/*.exe
            build/*.zip
            build/*.deb
            build/*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Job 2: Build FreeBSD (.tar.gz) inside QEMU VM
  # ------------------------------------------------------------------
  build-freebsd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake ninja gcc
          run: |
            cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
            cmake --build build
            cpack --config build/CPackConfig.cmake

      - name: Upload FreeBSD Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-freebsd
          path: |
            *.tar.gz
            build/*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Job 3: Create GitHub Release and Attach Packages
  # ------------------------------------------------------------------
  publish-release:
    needs: [build-native, build-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
